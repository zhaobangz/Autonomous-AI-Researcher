name: Scheduled Research

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      question:
        description: "Research question to run"
        required: false
        type: string

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Configure question and provider
        env:
          DISPATCH_QUESTION: ${{ github.event.inputs.question }}
          SECRET_QUESTION: ${{ secrets.RESEARCH_QUESTION }}
          LLM_PROVIDER_VALUE: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL_VALUE: ${{ secrets.LLM_MODEL }}
          OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY_VALUE: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY_VALUE: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY_VALUE" ] && [ -z "$ANTHROPIC_API_KEY_VALUE" ] && [ -z "$OPENROUTER_API_KEY_VALUE" ]; then
            echo "::error title=No LLM credentials::Set one of OPENAI_API_KEY, ANTHROPIC_API_KEY or OPENROUTER_API_KEY under Settings > Secrets and variables > Actions."
            {
              echo "### Scheduled Research Skipped"
              echo ""
              echo "No LLM provider key is configured for this repository."
              echo "Add **one** of these repository secrets to enable the daily run:"
              echo ""
              echo "- \`ANTHROPIC_API_KEY\`"
              echo "- \`OPENAI_API_KEY\`"
              echo "- \`OPENROUTER_API_KEY\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          question="${DISPATCH_QUESTION:-$SECRET_QUESTION}"
          if [ -z "$question" ]; then
            question="What are the practical limits of multi-agent research assistants for evidence synthesis?"
          fi

          {
            echo "RESEARCH_QUESTION<<EOF"
            echo "$question"
            echo "EOF"
          } >> "$GITHUB_ENV"

          if [ -n "$LLM_PROVIDER_VALUE" ]; then
            echo "LLM_PROVIDER=$LLM_PROVIDER_VALUE" >> "$GITHUB_ENV"
          elif [ -n "$OPENROUTER_API_KEY_VALUE" ]; then
            echo "LLM_PROVIDER=openrouter" >> "$GITHUB_ENV"
          elif [ -n "$ANTHROPIC_API_KEY_VALUE" ]; then
            echo "LLM_PROVIDER=anthropic" >> "$GITHUB_ENV"
          elif [ -n "$OPENAI_API_KEY_VALUE" ]; then
            echo "LLM_PROVIDER=openai" >> "$GITHUB_ENV"
          fi

          if [ -n "$LLM_MODEL_VALUE" ]; then
            echo "LLM_MODEL=$LLM_MODEL_VALUE" >> "$GITHUB_ENV"
          fi

      - name: Run headless research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Without this the search tool falls back to DuckDuckGo, which
          # rate-limits GitHub runner IPs hard enough that the run spends its
          # budget retrying empty searches.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Use Pinecone only when a key is present, so forks and key-less runs
          # keep working on the local chroma backend. Removing the secret is
          # enough to fall back.
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          VECTOR_BACKEND: ${{ secrets.PINECONE_API_KEY != '' && 'pinecone' || 'chroma' }}
          # A full run does real searches and sandboxed code execution, so the
          # 600s default is not enough on a runner. Bounded by timeout-minutes.
          RUN_TIMEOUT_SECONDS: "2400"
        run: |
          set +e
          python scripts/run_research.py "$RESEARCH_QUESTION" > run_output.txt 2>&1
          status=$?
          cat run_output.txt

          if [ "$status" -ne 0 ]; then
            message="$(tail -n 20 run_output.txt | tr '\n' ' ')"
            echo "::error title=Research failed::$message"
            {
              echo "### Scheduled Research Failed"
              echo ""
              echo '```'
              tail -n 20 run_output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

          summary="$(tail -n 1 run_output.txt)"
          echo "::notice title=Research complete::$summary"
          {
            echo "### Scheduled Research Complete"
            echo ""
            echo "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-research-runs
          path: ./runs/auto
          if-no-files-found: ignore
          retention-days: 30
