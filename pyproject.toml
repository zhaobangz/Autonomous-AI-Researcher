[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-ai-researcher"
version = "0.1.0"
description = "An autonomous multi-agent AI system designed to conduct comprehensive scientific research."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.1.1", "pytest-mock>=3.14.0", "fpdf2>=2.7.0"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["core", "agents", "tools", "memory", "ui", "api"]
