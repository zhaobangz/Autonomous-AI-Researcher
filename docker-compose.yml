version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    ports:
      - "8501:8501"
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - RUNS_DIR=/app/runs
      - REDIS_URL=redis://redis:6379
    mem_limit: 4g
    cpus: 2.0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
