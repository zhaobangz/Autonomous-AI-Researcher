version: '3.8'

services:
  app:
    build: .
    ports:
      - "8501:8501"
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    environment:
      - RUNS_DIR=/app/runs
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
